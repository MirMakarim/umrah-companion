<style>
/* Layout idea: Kaaba palette. Marble white ground, kiswa-black ink, brass-gold accent.
   One-screen phone app: header with trip day, scrolling view, fixed bottom tab bar. */
:root{
  --ground:#F3F3F0;
  --surface:#FFFFFF;
  --ink:#161614;
  --muted:#6A6A63;
  --line:#DDDCD5;
  --gold:#9A7428;
  --gold-soft:#F1E8D2;
  --ok:#2F6B45;
  --warn:#A2461F;
  --display:"Marcellus", "Times New Roman", serif;
  --body:"Atkinson Hyperlegible", -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0E0E0D; --surface:#1A1A18; --ink:#EDEBE4; --muted:#A3A097; --line:#2E2D29;
    --gold:#D2AE5E; --gold-soft:#2B2416; --ok:#7CC293; --warn:#E78B63; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --ground:#0E0E0D; --surface:#1A1A18; --ink:#EDEBE4; --muted:#A3A097; --line:#2E2D29;
  --gold:#D2AE5E; --gold-soft:#2B2416; --ok:#7CC293; --warn:#E78B63; color-scheme: dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;display:flex;flex-direction:column}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
header{padding:calc(14px + env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid var(--line);background:var(--surface)}
.brand{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.brand h1{font-family:var(--display);font-weight:400;font-size:24px;margin:0;letter-spacing:.02em;text-wrap:balance}
.clock{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.status{margin-top:6px;font-size:14px;color:var(--gold);font-weight:700}
.track{display:flex;gap:3px;margin-top:8px}
.track span{flex:1;height:4px;border-radius:2px;background:var(--line)}
.track span.past{background:var(--gold);opacity:.45}
.track span.now{background:var(--gold)}
main{flex:1;overflow-y:auto;padding:16px 16px 24px;-webkit-overflow-scrolling:touch}
.view{display:none;max-width:640px;margin:0 auto}
.view.on{display:block}
h2{font-family:var(--display);font-weight:400;font-size:22px;margin:4px 0 12px;text-wrap:balance}
h3{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.chip.today::after{content:" •";color:var(--gold)}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:58px 1fr 34px;gap:10px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.item.key{border-left:4px solid var(--gold)}
.item.next{box-shadow:0 0 0 2px var(--gold)}
.time{font-weight:700;font-variant-numeric:tabular-nums;font-size:14px;color:var(--gold);line-height:1.3}
.what{font-weight:700}
.det{color:var(--muted);font-size:14px;margin-top:3px}
.ref{display:inline-block;margin-top:6px;font-size:12px;background:var(--gold-soft);color:var(--ink);border-radius:6px;padding:2px 7px;font-variant-numeric:tabular-nums}
.tick{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:transparent;cursor:pointer;display:grid;place-items:center;padding:0}
.tick svg{width:16px;height:16px;opacity:0}
.done .tick{background:var(--ok);border-color:var(--ok)}
.done .tick svg{opacity:1}
.done .what,.done .det{text-decoration:line-through;opacity:.55}
.simple{grid-template-columns:1fr 34px}
.badge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 6px;border-radius:5px;border:1px solid var(--line);color:var(--muted);margin-left:6px;vertical-align:middle}
.progress{font-size:14px;color:var(--muted);margin:-6px 0 12px;font-variant-numeric:tabular-nums}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;margin-bottom:14px}
.seg button{flex:1;border:0;background:transparent;padding:8px;border-radius:8px;cursor:pointer;font-weight:700;font-size:14px}
.seg button.on{background:var(--ink);color:var(--ground)}
/* Rounds counter */
.counter{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.counter .top{display:flex;justify-content:space-between;align-items:baseline}
.counter .name{font-family:var(--display);font-size:22px}
.counter .of{color:var(--muted);font-variant-numeric:tabular-nums}
.rounds{display:flex;gap:8px;justify-content:space-between;margin:14px 0}
.rounds i{flex:1;aspect-ratio:1;max-width:40px;border-radius:50%;border:2px solid var(--gold);display:grid;place-items:center;font-style:normal;font-weight:700;font-size:14px;color:var(--gold);font-variant-numeric:tabular-nums}
.rounds i.done{background:var(--gold);color:var(--surface)}
.big{width:100%;border:0;border-radius:12px;padding:18px;background:var(--ink);color:var(--ground);font-size:18px;font-weight:700;cursor:pointer}
.big:disabled{opacity:.4}
.row{display:flex;gap:8px;margin-top:8px}
.ghost{flex:1;border:1px solid var(--line);background:transparent;border-radius:10px;padding:10px;cursor:pointer;font-size:14px}
.hint{font-size:14px;color:var(--muted);margin-top:10px}
.dir{font-size:15px;font-weight:700;margin-top:4px;min-height:22px}
/* Money */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.tile b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.tile span{font-size:13px;color:var(--muted)}
.tile.hero{grid-column:1/-1;background:var(--ink);color:var(--ground);border-color:var(--ink)}
.tile.hero span{color:inherit;opacity:.75}
.money{display:grid;grid-template-columns:1fr auto;gap:4px 10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.money .amt{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.money .sub{grid-column:1/-1;font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.money input{width:90px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--ground);color:var(--ink);font:inherit;font-size:14px;font-variant-numeric:tabular-nums}
.over{color:var(--warn);font-weight:700}
.under{color:var(--ok);font-weight:700}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}
.card .what{margin-bottom:2px}
a{color:var(--gold)}
nav{display:grid;grid-template-columns:repeat(6,1fr);border-top:1px solid var(--line);background:var(--surface);padding-bottom:env(safe-area-inset-bottom)}
nav button{border:0;background:transparent;padding:8px 2px 9px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted)}
nav button svg{width:22px;height:22px}
nav button.on{color:var(--gold);font-weight:700}
@media (prefers-reduced-motion:no-preference){.item,.tick{transition:background .15s,border-color .15s,opacity .15s}}
</style>
</head>

 ["Taif day trip","Optional",250,"SAR"],
 ["Food, 12 days at €20","Estimate",240,"EUR"],
 ["Saudi SIM","Estimate",70,"SAR"],
 ["2 thobes","Estimate",200,"SAR"],
 ["Dates and gifts","Estimate",300,"SAR"],
 ["Barber, laundry, Zamzam","Estimate",105,"SAR"],
 ["Buffer","Estimate",100,"EUR"]
];

const INFO=[
 ["Flights","Royal Jordanian","Out: RJ130 Wed 18 Nov 15:00 DUS→AMM, RJ704 Thu 19 Nov 01:35 AMM→JED T1. Back: RJ723 Mon 30 Nov 07:00 MED→AMM, RJ129 10:55 AMM→DUS. 1 × 30 kg checked, 7 kg carry-on. Customer service +962 6 5100000."],
 ["Makkah hotel","Elaf Bakkah Hotel","Al Rahmah St, Mahbas Al Jan. Phone +966 12 529 8822. Two Agoda bookings: 18 to 24 Nov and 24 to 25 Nov. Free 24/7 shuttle to the Haram."],
 ["Madinah hotel","Al Ayniah Hotel","Prince Abdul Majeed St, Al Anbariyah. Phone +966 557722180. Booked on Booking.com. Check-in 16:00 to 18:00 on 25 Nov. SAR 988.76 paid at the hotel."],
 ["Trains","Haramain High Speed Railway","19 Nov 06:05 train 05065, coach 9 seat 255. 25 Nov 11:20 train 01112, coach 9 seat 243. Tickets in Apple Wallet."],
 ["Visa","Saudi tourist e-visa","Multiple entry, valid to 31 Jul 2027, up to 90 days."],
 ["Permits","Nusuk","Umrah: Thu 19 Nov, 14:01. Rawdah: Thu 26 Nov, 02:00, gate 37."],
 ["SIM","If you still need one","Jeddah airport kiosks (only before 05:15), or STC and Mobily shops on floor P3 of the Clock Tower. Ask for a visitor plan of 15 to 20 GB for at least 14 days."],
 ["Zamzam","Royal Jordanian rule","One sealed 5 L bottle per passenger, free and on top of your allowance. Buy it at Madinah airport and hand it in at check-in."]
];

/* ---------- State (kept on this device only) ---------- */
let S={done:{},actual:{},tawaf:0,sai:0,list:"z"};
function load(){try{const t=localStorage.getItem("umrah-companion");if(t)S=Object.assign(S,JSON.parse(t));}catch(e){}}
function save(){try{localStorage.setItem("umrah-companion",JSON.stringify(S));}catch(e){}}

/* ---------- Helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function riyadhNow(){
  const p=new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Riyadh",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false}).formatToParts(new Date());
  const g=t=>p.find(x=>x.type===t).value;
  return {date:`${g("year")}-${g("month")}-${g("day")}`,hm:`${g("hour")==="24"?"00":g("hour")}:${g("minute")}`};
}
function todayIndex(){const d=riyadhNow().date;return DAYS.findIndex(x=>x.date===d);}
function fmtEUR(v){return "€"+v.toLocaleString("en-GB",{minimumFractionDigits:0,maximumFractionDigits:0});}

function itemHTML(key,time,what,det,ref,isKey,next){
  const done=S.done[key];
  return `<div class="item${isKey?" key":""}${done?" done":""}${next?" next":""}">
    <div class="time">${esc(time)}</div>
    <div><div class="what">${esc(what)}</div>${det?`<div class="det">${esc(det)}</div>`:""}${ref?`<span class="ref">${esc(ref)}</span>`:""}</div>
    <button class="tick" data-k="${key}" aria-label="Mark done">${CHECK}</button></div>`;
}
function simpleHTML(key,what,det){
  const done=S.done[key];
  return `<div class="item simple${done?" done":""}"><div><div class="what">${esc(what)}</div>${det?`<div class="det">${esc(det)}</div>`:""}</div>
    <button class="tick" data-k="${key}" aria-label="Mark done">${CHECK}</button></div>`;
}
function dayList(i,highlightNext){
  const d=DAYS[i];let nextIdx=-1;
  if(highlightNext){
    const hm=riyadhNow().hm;
    nextIdx=d.items.findIndex((it,j)=>!S.done[d.id+"-"+j]&&(!/^\d\d:\d\d/.test(it[0])||it[0]>=hm));
  }
  return `<div class="list">${d.items.map((it,j)=>itemHTML(d.id+"-"+j,it[0],it[1],it[2],it[3],it[4],j===nextIdx)).join("")}</div>`;
}

/* ---------- Header ---------- */
function renderHeader(){
  const n=riyadhNow(),ti=todayIndex();
  $("#clock").innerHTML=`Saudi time<br><b>${n.hm}</b>`;
  let st;
  if(ti>0){st=`${DAYS[ti].title.split(" · ")[0]} of 13 · ${DAYS[ti].city}`;}
  else if(n.date<"2026-11-18"){const ms=new Date("2026-11-18T00:00:00+03:00")-new Date();const dd=Math.ceil(ms/86400000);st=`${dd} day${dd===1?"":"s"} until you fly`;}
  else st="Trip complete. Umrah mubarak.";
  $("#status").textContent=st;
  $("#track").innerHTML=DAYS.slice(1).map((d,k)=>`<span class="${k+1<ti?"past":k+1===ti?"now":""}"></span>`).join("");
}

/* ---------- Views ---------- */
let planDay=null;
function renderToday(){
  const ti=todayIndex();const i=ti>0?ti:0;const d=DAYS[i];
  const total=d.items.length,doneN=d.items.filter((_,j)=>S.done[d.id+"-"+j]).length;
  let html=`<h2>${esc(d.title)}</h2><div class="progress">${doneN} of ${total} done</div>${dayList(i,ti>0)}`;
  if(ti<=0&&riyadhNow().date<"2026-11-18"){html+=`<h3>First travel day</h3>${dayList(1,false)}`;}
  else if(ti>0&&ti<DAYS.length-1){html+=`<h3>Tomorrow · ${esc(DAYS[ti+1].title.split(" · ")[1])}</h3>`+DAYS[ti+1].items.slice(0,2).map(it=>`<div class="card"><div class="what">${esc(it[0])} · ${esc(it[1])}</div></div>`).join("");}
  $("#v-today").innerHTML=html;
}
function renderPlan(){
  if(planDay===null){const ti=todayIndex();planDay=ti>0?ti:0;}
  const ti=todayIndex();
  $("#dayChips").innerHTML=DAYS.map((d,i)=>`<button class="chip${i===planDay?" on":""}${i===ti?" today":""}" data-day="${i}">${esc(d.label)}</button>`).join("");
  $("#dayList").innerHTML=`<h3 style="margin-top:4px">${esc(DAYS[planDay].title)}</h3>`+dayList(planDay,planDay===ti);
}
function renderLists(){
  const isZ=S.list==="z";$("#segZ").classList.toggle("on",isZ);$("#segP").classList.toggle("on",!isZ);
  const groups=isZ?ZIY:PACK;let all=0,dn=0,html="";
  groups.forEach((g,gi)=>{
    html+=`<h3>${esc(g[0])}</h3><div class="list">`;
    g[1].forEach((it,j)=>{const k=(isZ?"z":"p")+gi+"-"+j;all++;if(S.done[k])dn++;html+=simpleHTML(k,it[0],it[1]);});
    html+="</div>";
  });
  $("#listProg").textContent=`${dn} of ${all} ${isZ?"visited":"packed"}`;
  $("#listBody").innerHTML=html;
}
function renderMoney(){
  const eur=b=>b[3]==="EUR"?b[2]:b[2]/RATE;
  const sum=f=>BUDGET.filter(f).reduce((a,b)=>a+eur(b),0);
  const paid=sum(b=>b[1]==="Paid"),card=sum(b=>b[1].startsWith("Card")),hotel=sum(b=>b[1]==="Pay at hotel"),est=sum(b=>b[1]==="Estimate"),opt=sum(b=>b[1]==="Optional");
  const total=paid+card+hotel+est;
  const actual=Object.values(S.actual).reduce((a,v)=>a+(parseFloat(v)||0),0);
  let html=`<div class="tiles">
    <div class="tile hero"><span>Planned total (without Taif)</span><b>${fmtEUR(total)}</b></div>
    <div class="tile"><span>Already paid</span><b>${fmtEUR(paid)}</b></div>
    <div class="tile"><span>Card charges coming</span><b>${fmtEUR(card)}</b></div>
    <div class="tile"><span>Pay at Madinah hotel</span><b>${fmtEUR(hotel)}</b></div>
    <div class="tile"><span>Spending in Saudi</span><b>${fmtEUR(est)}</b></div>
    <div class="tile"><span>Spent so far (your entries)</span><b>${fmtEUR(actual)}</b></div>
    <div class="tile"><span>Taif, if you go</span><b>${fmtEUR(opt)}</b></div>
  </div><div class="hint">Rate 4.33 SAR per euro. Type what you actually spent (in €) under each item.</div><h3>Items</h3><div class="list">`;
  BUDGET.forEach((b,i)=>{
    const plan=eur(b),a=S.actual[i];const diff=a!==undefined&&a!==""?(parseFloat(a)-plan):null;
    html+=`<div class="money"><div class="what">${esc(b[0])}<span class="badge">${esc(b[1])}</span></div><div class="amt">${fmtEUR(plan)}</div>
      <div class="sub">${b[3]==="SAR"?esc(b[2].toLocaleString("en-GB"))+" SAR · ":""}<label for="act${i}">Actual €</label><input id="act${i}" inputmode="decimal" data-a="${i}" value="${a!==undefined?esc(a):""}">
      ${diff!==null&&!isNaN(diff)?`<span class="${diff>0?"over":"under"}">${diff>0?"+":""}${fmtEUR(diff).replace("€-","-€")}</span>`:""}</div></div>`;
  });
  $("#moneyBody").innerHTML=html+"</div>";
}
function renderInfo(){
  $("#infoBody").innerHTML=INFO.map(x=>`<div class="card"><h3 style="margin:0 0 4px">${esc(x[0])}</h3><div class="what">${esc(x[1])}</div><div class="det">${esc(x[2])}</div></div>`).join("")+
  `<div class="card"><div class="what">Full plan and sources</div><div class="det">Your Google Sheet has every detail and source link, and works offline in the Google Sheets app.</div><a href="${SHEET}">Open Umrah Plan sheet</a></div>
   <div class="hint">Booking numbers, visa number and PNR are left out of this app on purpose; they are in your Google Sheet. Ticks and amounts are saved on this phone only.</div>`;
}
function counterHTML(id,name,n,hint){
  const dirs=["Start at Safa","Safa → Marwa","Marwa → Safa"];
  let dir="";
  if(id==="sai"){dir=n>=7?"Finished at Marwa":n===0?"Start at Safa, walk to Marwa":(n%2===0?"Round "+(n+1)+": Safa → Marwa":"Round "+(n+1)+": Marwa → Safa");}
  else dir=n>=7?"Tawaf complete. Pray 2 rak'ah behind Maqam Ibrahim.":"Round "+(n+1)+": start at the Black Stone line";
  return `<div class="counter"><div class="top"><div class="name">${name}</div><div class="of">${n} / 7</div></div>
    <div class="dir">${esc(dir)}</div>
    <div class="rounds">${[1,2,3,4,5,6,7].map(r=>`<i class="${r<=n?"done":""}">${r}</i>`).join("")}</div>
    <button class="big" data-inc="${id}" ${n>=7?"disabled":""}>${n>=7?"Done":"Round "+(n+1)+" finished"}</button>
    <div class="row"><button class="ghost" data-undo="${id}">Undo last</button><button class="ghost" data-reset="${id}">Reset</button></div>
    <div class="hint">${esc(hint)}</div></div>`;
}
function renderRounds(){
  $("#counters").innerHTML=counterHTML("tawaf","Tawaf",S.tawaf,"Keep the Kaaba on your left. Each round starts and ends at the Black Stone corner, marked by a green light.")+
    counterHTML("sai","Sa'i",S.sai,"Safa to Marwa counts as one, Marwa back to Safa as two. Men walk faster between the green lights.");
}

/* ---------- Navigation and events ---------- */
const VIEWS=["today","plan","rounds","lists","money","info"];
let current="today";
function show(v){
  if(!VIEWS.includes(v))v="today";current=v;
  document.querySelectorAll(".view").forEach(s=>s.classList.toggle("on",s.id==="v-"+v));
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===v));
  renderAll();$("#main").scrollTop=0;
  if(location.hash!=="#"+v&&!(v==="today"&&!location.hash))history.replaceState(null,"","#"+v);
}
function renderAll(){
  renderHeader();
  ({today:renderToday,plan:renderPlan,rounds:renderRounds,lists:renderLists,money:renderMoney,info:renderInfo})[current]();
}
document.addEventListener("click",e=>{
  const t=e.target.closest("button");if(!t)return;
  if(t.dataset.v){show(t.dataset.v);return;}
  if(t.dataset.k){S.done[t.dataset.k]=!S.done[t.dataset.k];save();renderAll();return;}
  if(t.dataset.day){planDay=+t.dataset.day;renderPlan();return;}
  if(t.dataset.inc){S[t.dataset.inc]=Math.min(7,S[t.dataset.inc]+1);save();renderRounds();if(navigator.vibrate)try{navigator.vibrate(30)}catch(_){};return;}
  if(t.dataset.undo){S[t.dataset.undo]=Math.max(0,S[t.dataset.undo]-1);save();renderRounds();return;}
  if(t.dataset.reset){S[t.dataset.reset]=0;save();renderRounds();return;}
  if(t.id==="segZ"){S.list="z";save();renderLists();return;}
  if(t.id==="segP"){S.list="p";save();renderLists();return;}
});
document.addEventListener("change",e=>{
  const a=e.target.dataset&&e.target.dataset.a;if(a===undefined)return;
  const v=e.target.value.replace(",",".").trim();
  if(v==="")delete S.actual[a];else S.actual[a]=v;save();renderMoney();
});
window.addEventListener("hashchange",()=>show(location.hash.slice(1)));

function start(data){
  load();
  if(data&&data.S)S=Object.assign(S,data.S);
  window.claude?.hot?.snapshot?.(()=>({S}));
  show(location.hash.slice(1)||"today");
  setInterval(renderHeader,30000);
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
if("serviceWorker" in navigator){window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{});});}
</script>
